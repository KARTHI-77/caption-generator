# ✅ Gradle optimization for low RAM systems
org.gradle.daemon=true
org.gradle.parallel=false
org.gradle.configureondemand=true
org.gradle.jvmargs=-Xmx1024m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8
org.gradle.jvmargs=-Xmx2048m -Dkotlin.daemon.jvm.options="-Xmx2G"

# ✅ Kotlin compiler memory limit
kotlin.incremental=true
kotlin.daemon.jvmargs=-Xmx512m

# ✅ Flutter/AndroidX
android.useAndroidX=true
android.enableJetifier=true

# ✅ Disable deprecated cache option
# android.enableBuildCache=true
# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false
